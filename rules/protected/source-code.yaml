# Source code. Protected: SpaceKit shows repositories and never removes them.
# Schema: docs/RULES.md
group: Source code
category: personal.code

rules:
  - id: code.git-repositories
    name: Git repositories
    description: Git metadata of your repositories, including unpushed commits, branches and stashes. SpaceKit never removes it and asks before removing any folder that is a repository; generated folders inside a project (node_modules, build output) are listed under their own rules.
    match:
      names: [.git]
    safety: protected
